# Optional: the same SLO logic as Sentinel's own alerts, expressed in Prometheus.
# Sentinel already raises these itself; use these only if you want Alertmanager to route them.
groups:
  - name: sentinel-slo
    rules:
      - alert: SentinelServiceDown
        expr: sentinel_service_up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} has failed its checks for 2 minutes"

      - alert: SentinelErrorBudgetFastBurn
        expr: sentinel_slo_burn_alert_firing{severity="critical"} == 1
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} is burning its error budget fast or has none left"

      - alert: SentinelErrorBudgetLow
        expr: sentinel_slo_error_budget_remaining_ratio < 0.25
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} has less than 25% of its error budget left"

      - alert: SentinelIncidentOpen
        expr: sentinel_incidents_open > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Sentinel has had an incident open for 5 minutes"
